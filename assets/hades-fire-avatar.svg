<svg xmlns="http://www.w3.org" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#194d94"/>
      <stop offset="55%" stop-color="#081a38"/>
      <stop offset="100%" stop-color="#020814"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="68%" cy="30%" r="36%">
      <stop offset="0%" stop-color="#a8e8ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#2ea8ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#081a38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="30%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#ff4d2e" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#b81d13" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020814" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d384d"/>
      <stop offset="50%" stop-color="#141b29"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff512f"/>
      <stop offset="55%" stop-color="#8f1414"/>
      <stop offset="100%" stop-color="#1a0508"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ce4ff"/>
      <stop offset="50%" stop-color="#1488ff"/>
      <stop offset="100%" stop-color="#5ce1ff"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="244"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Fundo cósmico azul PS4 -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="348" cy="154" r="185" fill="url(#moonGlow)"/>
    <circle cx="155" cy="348" r="220" fill="url(#emberGlow)"/>

    <!-- Lua cheia e silhueta de castelo gótico ao fundo -->
    <circle cx="352" cy="148" r="56" fill="#dff6ff" opacity="0.88"/>
    <path d="M350 280 V208 H366 V192 H376 V208 H392 V182 L400 166 L408 182 V208 H424 V196 H434 V280 Z" fill="#071326" opacity="0.85"/>

    <!-- Capa flamejante esvoaçante (esquerda/fundo) -->
    <path d="M40 365 Q110 270 195 280 L235 470 L30 470 Z" fill="url(#cape)" opacity="0.92"/>
    <path d="M62 330 Q125 295 180 315 Q130 340 75 358 Z" fill="#ff7347" opacity="0.55"/>

    <!-- Ombros e armadura do guerreiro -->
    <path d="M108 495 C118 370, 165 325, 256 325 C347 325, 394 370, 404 495 Z" fill="url(#armor)" stroke="#4cb8ff" stroke-width="2.5" stroke-opacity="0.55"/>
    <!-- Ombreira esquerda com espinhos -->
    <path d="M115 365 L85 335 L138 332 L120 302 L175 316 L195 368 Z" fill="#182236" stroke="#62c8ff" stroke-width="2"/>
    <!-- Ombreira direita -->
    <path d="M397 365 L425 338 L374 334 L390 306 L338 318 L318 368 Z" fill="#182236" stroke="#62c8ff" stroke-width="2"/>
    <!-- Detalhe central no peitoral -->
    <polygon points="256,348 274,385 256,435 238,385" fill="#0a1222" stroke="#39c8ff" stroke-width="2.5"/>
    <polygon points="256,364 264,385 256,412 248,385" fill="#5ce1ff" filter="url(#neon)"/>

    <!-- Pescoço e rosto sombrio -->
    <path d="M234 295 H278 L284 336 H228 Z" fill="#1a1822"/>
    <path d="M214 215 C214 172, 298 172, 298 215 C298 262, 280 296, 256 302 C232 296, 214 262, 214 215 Z" fill="#e6cfc5"/>
    <!-- Sombra dramática nos olhos -->
    <path d="M214 210 Q256 226 298 210 L295 238 Q256 248 217 238 Z" fill="#090d1a" opacity="0.72"/>
    <!-- Olhos brilhantes azul-ciano -->
    <ellipse cx="239" cy="232" rx="7" ry="3.5" fill="#6eeeff" filter="url(#neon)"/>
    <ellipse cx="273" cy="232" rx="7" ry="3.5" fill="#6eeeff" filter="url(#neon)"/>

    <!-- Cabelos longos escuros esvoaçantes -->
    <path d="M196 235 C182 165, 225 128, 262 132 C308 136, 334 175, 322 245 C332 275, 328 312, 310 335 C306 292, 304 245, 292 212 C272 225, 244 222, 224 205 C210 238, 206 288, 198 332 C182 308, 184 268, 196 235 Z" fill="#090d17" stroke="#2d74b8" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Mechas frontais -->
    <path d="M235 168 Q222 208 215 256 Q230 220 246 184 Z" fill="#0f1729"/>
    <path d="M275 166 Q290 206 298 254 Q282 218 266 182 Z" fill="#0f1729"/>

    <!-- Partículas de brasas e energia -->
    <circle cx="142" cy="252" r="3.5" fill="#ff6b4a" filter="url(#neon)"/>
    <circle cx="118" cy="296" r="2.5" fill="#ff8c69"/>
    <circle cx="168" cy="210" r="2" fill="#ff5733"/>
    <circle cx="378" cy="245" r="3" fill="#66e3ff" filter="url(#neon)"/>
    <circle cx="342" cy="292" r="2.5" fill="#66e3ff"/>
  </g>

  <!-- Moldura circular dupla estilo PS4 -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#ring)" stroke-width="8" filter="url(#neon)"/>
  <circle cx="256" cy="256" r="233" fill="none" stroke="#9beeff" stroke-width="2" stroke-opacity="0.75"/>
</svg>
