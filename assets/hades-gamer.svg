<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="title desc">
<title id="title">Hades, mascote gamer da HADES Store</title><desc id="desc">Deus do submundo em armadura, usando headset e segurando um controle, com luzes violetas e douradas.</desc>
<defs>
 <radialGradient id="halo"><stop stop-color="#815bd4" stop-opacity=".45"/><stop offset=".65" stop-color="#472c70" stop-opacity=".16"/><stop offset="1" stop-color="#100e1a" stop-opacity="0"/></radialGradient>
 <linearGradient id="cloak" x2="1" y2="1"><stop stop-color="#41304f"/><stop offset=".5" stop-color="#201a2d"/><stop offset="1" stop-color="#11131d"/></linearGradient>
 <linearGradient id="armor" x2=".8" y2="1"><stop stop-color="#d6b878"/><stop offset=".3" stop-color="#775b42"/><stop offset="1" stop-color="#28222c"/></linearGradient>
 <linearGradient id="skin" x2=".9" y2="1"><stop stop-color="#f4d4ad"/><stop offset="1" stop-color="#b87e67"/></linearGradient>
 <linearGradient id="hair" x2="0" y2="1"><stop stop-color="#24202b"/><stop offset="1" stop-color="#090b12"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#f4dfaa"/><stop offset="1" stop-color="#9b6e36"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
