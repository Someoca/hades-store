name: Build HADES Store native PS4 PKG
on:
  push:
    branches: [main]
    paths:
      - 'ps4-native/**'
      - 'assets/hades-gamer.svg'
      - 'assets/hades-fire-avatar.svg'
      - 'assets/hades-home-banner.svg'
      - 'assets/hades-sigil.svg'
      - 'assets/covers/**'
      - 'catalog/catalog.json'
      - 'tools/validate-catalog.mjs'
      - '.github/workflows/build-ps4-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ps4-native/**'
      - 'assets/hades-gamer.svg'
      - 'assets/hades-fire-avatar.svg'
      - 'assets/hades-home-banner.svg'
      - 'assets/hades-sigil.svg'
      - 'assets/covers/**'
      - 'catalog/catalog.json'
      - '.github/workflows/build-ps4-native.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the official OpenOrbis toolchain container
        run: |
          docker run --rm --user 0 \
            -e OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc "apt-get update && apt-get install -y python3 python3-pil fonts-dejavu-core librsvg2-bin curl tar && bash ps4-native/build.sh"
      - name: Publish PKG to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2 secrets are missing. Configure R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY."
            exit 1
          fi

          # Accept an account ID or its Cloudflare R2 endpoint.
          R2_ACCOUNT_ID="$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ "$R2_ACCOUNT_ID" =~ ^https://([a-fA-F0-9]{32})\.r2\.cloudflarestorage\.com/?$ ]]; then
            R2_ACCOUNT_ID="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$R2_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID must be the 32-character Cloudflare Account ID or its HTTPS R2 endpoint."
            exit 1
          fi
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          python3 -m pip install --user awscli
          export PATH="$HOME/.local/bin:$PATH"

          aws s3 cp ps4-native/dist/HADES-Store-PS4-v1.4.pkg \
            s3://hades-store-downloads/HADES-Store-PS4-v1.4.pkg \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --content-type "application/vnd.playstation.pkg" \
            --cache-control "public, max-age=300"

          aws s3 cp ps4-native/dist/SHA256SUMS.txt \
            s3://hades-store-downloads/HADES-Store-PS4-v1.4-SHA256SUMS.txt \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --content-type "text/plain" \
            --cache-control "public, max-age=300"
