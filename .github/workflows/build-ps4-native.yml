name: Build HADES Store native PS4 PKG
on:
  push:
    branches: [main]
    paths:
      - 'ps4-native/**'
      - 'assets/hades-gamer.svg'
      - 'assets/hades-fire-avatar.svg'
      - 'assets/hades-home-banner.svg'
      - 'assets/hades-sigil.svg'
      - 'assets/covers/**'
      - 'catalog/catalog.json'
      - 'tools/validate-catalog.mjs'
      - '.github/workflows/build-ps4-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ps4-native/**'
      - 'assets/hades-gamer.svg'
      - 'assets/hades-fire-avatar.svg'
      - 'assets/hades-home-banner.svg'
      - 'assets/hades-sigil.svg'
      - 'assets/covers/**'
      - 'catalog/catalog.json'
      - '.github/workflows/build-ps4-native.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the official OpenOrbis toolchain container
        run: |
          docker run --rm --user 0 \
            -e OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc "apt-get update && apt-get install -y python3 python3-pil fonts-dejavu-core librsvg2-bin curl tar && bash ps4-native/build.sh"
      - name: Publish PKG to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning::PKG built successfully but R2 upload skipped: GitHub Actions R2 secrets are not configured."
            exit 0
          fi
          python3 -m pip install --user awscli
          export PATH="$HOME/.local/bin:$PATH"
          aws s3 cp ps4-native/dist/HADES-Store-PS4-v1.4.pkg \
            s3://hades-store-downloads/HADES-Store-PS4-v1.4.pkg \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --content-type "application/vnd.playstation.pkg" \
            --cache-control "public, max-age=300"
          aws s3 cp ps4-native/dist/SHA256SUMS.txt \
            s3://hades-store-downloads/HADES-Store-PS4-v1.4-SHA256SUMS.txt \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --content-type "text/plain" \
            --cache-control "public, max-age=300"
      - name: Upload installable PKG and checksum (optional backup)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: HADES-Store-PS4-PKG-v1.4
          path: |
            ps4-native/dist/HADES-Store-PS4-v1.4.pkg
            ps4-native/dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 1
