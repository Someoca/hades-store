name: Build HADES Store native PS4 PKG
on:
  push:
    branches: [main]
    paths:
      - 'ps4-native/**'
      - 'assets/hades-gamer.svg'
      - 'assets/hades-fire-avatar.svg'
      - 'assets/hades-home-banner.svg'
      - 'assets/hades-sigil.svg'
      - 'assets/covers/**'
      - 'catalog/catalog.json'
      - 'tools/validate-catalog.mjs'
      - '.github/workflows/build-ps4-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ps4-native/**'
      - 'assets/hades-gamer.svg'
      - 'assets/hades-fire-avatar.svg'
      - 'assets/hades-home-banner.svg'
      - 'assets/hades-sigil.svg'
      - 'assets/covers/**'
      - 'catalog/catalog.json'
      - '.github/workflows/build-ps4-native.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the official OpenOrbis toolchain container
        run: |
          docker run --rm --user 0 \
            -e OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc "apt-get update && apt-get install -y python3 python3-pil fonts-dejavu-core librsvg2-bin curl tar && bash ps4-native/build.sh"
      - name: Publish PKG and checksum to Cloudflare R2 with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or R2_ACCOUNT_ID GitHub Actions secret."
            exit 1
          fi

          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID must be the 32-character Cloudflare Account ID."
            exit 1
          fi

          npx --yes wrangler@4.162.0 r2 object put hades-store-downloads/HADES-Store-PS4-v1.4.pkg \
            --file=ps4-native/dist/HADES-Store-PS4-v1.4.pkg \
            --remote \
            --content-type="application/vnd.playstation.pkg" \
            --cache-control="public, max-age=300"

          npx --yes wrangler@4.162.0 r2 object put hades-store-downloads/HADES-Store-PS4-v1.4-SHA256SUMS.txt \
            --file=ps4-native/dist/SHA256SUMS.txt \
            --remote \
            --content-type="text/plain" \
            --cache-control="public, max-age=300"
