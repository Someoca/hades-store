name: Validate HADES Store for Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate catalog
        run: node tools/validate-catalog.mjs

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Test local static server
        run: node tools/test-local-server.mjs

      - name: Validate static site files
        run: test -s index.html && test -s style.css && test -s app.js

      - name: Confirm Cloudflare Pages entry point
        run: test -f index.html && test -f _headers
