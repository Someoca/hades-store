name: Higienizar Catálogo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar limpeza do catálogo
        run: node tools/fix-catalog.mjs

      - name: Validar catálogo corrigido
        run: node tools/validate-catalog.mjs

      - name: Salvar alterações no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git diff --staged --quiet || git commit -m "chore: higienizar dados e links duplicados no catalogo"
          git push

