name: Atualizar capas reais e publicar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-covers.yml'
      - 'tools/cover-sources.json'
      - 'tools/download-real-covers.mjs'
      - 'tools/download-missing-game-covers.mjs'
      - 'tools/standardize-covers.mjs'
      - 'tools/generate-app-covers.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: app-covers-publish
  cancel-in-progress: true

jobs:
  refresh-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Baixar capas reais que faltam no catálogo
        run: node tools/download-missing-game-covers.mjs

      - name: Gerar capas refinadas dos aplicativos e emuladores
        run: node tools/generate-app-covers.mjs

      - name: Preservar capas locais e padronizar o restante
        run: node tools/standardize-covers.mjs

      - name: Validar catálogo
        run: node tools/validate-catalog.mjs

      - name: Registrar capas no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/covers/ catalog/catalog.json
          git diff --staged --quiet || git commit -m "art: substituir capas genéricas por capas reais"
          git pull --rebase origin main
          git push || { git pull --rebase origin main; git push; }

      - name: Preparar publicação do GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site atualizado para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar loja atualizada
        id: deployment
        uses: actions/deploy-pages@v4
